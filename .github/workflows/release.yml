# Tag push (v*) builds idefix for darwin-arm64 + linux-x86_64 and attaches
# the binaries to the GitHub Release. mojo comes from `pip install modular`.
name: release
on:
  push:
    tags: ["v*"]
jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-14
            artifact: idefix-darwin-arm64
          - os: ubuntu-22.04
            artifact: idefix-linux-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install modular
      - name: Install patchelf + libcurl-dev (linux)
        if: matrix.os == 'ubuntu-22.04'
        # -lcurl needs the dev package: runner has the runtime lib only.
        run: sudo apt-get update && sudo apt-get install -y patchelf libcurl4-openssl-dev
      - name: Build
        # MOJO=mojo uses the pip console-script wrapper: it exports the
        # MODULAR_* env vars the raw bin/mojo needs to locate std +
        # CompilerRT. (modular is a PEP 420 namespace package; __file__
        # is None, and raw bin/mojo fails without those vars.)
        run: make bundle MOJO=mojo
      - name: Test (linux/macos smoke)
        # /quit exits before server contact but needs MAX_MODEL set
        run: ./bundle/idefix --help | grep -q idefix && echo "/quit" | MAX_MODEL=smoke/test ./bundle/idefix --repo . --bare
      - name: Package bundle (binary + runtime dylibs)
        run: tar -czf "${{ matrix.artifact }}.tar.gz" -C bundle .
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.tar.gz
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
      - name: Generate checksums
        # One checksums.txt covering both tarballs; bare basenames so the
        # installer can verify a downloaded file with `shasum -a 256 -c`.
        run: |
          for d in idefix-darwin-arm64 idefix-linux-x86_64; do
            (cd "$d" && shasum -a 256 *.tar.gz)
          done > checksums.txt
          cat checksums.txt
      - name: Stage installer as a release asset
        # ships as install.sh so the curl|sh URL is
        # releases/latest/download/install.sh — pinned to the release,
        # never drifting with main.
        run: cp scripts/install-remote.sh install.sh
      - name: Attach binaries to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            idefix-darwin-arm64/idefix-darwin-arm64.tar.gz
            idefix-linux-x86_64/idefix-linux-x86_64.tar.gz
            checksums.txt
            install.sh
