# Tag push (v*) builds max for darwin-arm64 + linux-x86_64 and attaches
# the binaries to the GitHub Release. mojo comes from `pip install modular`.
name: release
on:
  push:
    tags: ["v*"]
jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-14
            artifact: max-darwin-arm64
          - os: ubuntu-22.04
            artifact: max-linux-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install modular
      - name: Install patchelf (linux rpath fixup)
        if: matrix.os == 'ubuntu-22.04'
        run: sudo apt-get install -y patchelf
      - name: Build
        run: make bundle MOJO="$(python -c 'import modular, os; print(os.path.join(os.path.dirname(modular.__file__), "bin", "mojo"))')"
      - name: Test (linux/macos smoke)
        run: ./bundle/max --help | grep -q max && echo "/quit" | ./bundle/max --repo . --bare
      - name: Package bundle (binary + runtime dylibs)
        run: tar -czf "${{ matrix.artifact }}.tar.gz" -C bundle .
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.tar.gz
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
      - name: Attach binaries to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            max-darwin-arm64/max-darwin-arm64.tar.gz
            max-linux-x86_64/max-linux-x86_64.tar.gz
